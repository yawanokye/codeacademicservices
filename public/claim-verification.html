<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Approved Claim</title><link rel="stylesheet" href="/styles.css"></head><body>
<header class="topbar"><div class="brand"><img src="/ucc-logo.png" alt="UCC logo"><div><h1>Approved Claim Verification</h1><small>College of Distance Education</small></div></div></header>
<main class="page-wrap"><section class="form-card" style="max-width:760px;margin:auto"><div class="eyebrow">Approval integrity check</div><h2>Verify an approved claim</h2><form id="form" class="grid2"><div class="field"><label>Verification Code</label><input id="code" required placeholder="UCC-1234-ABCD"></div><div class="actions"><button class="btn" type="submit">Verify</button></div></form><div id="result" class="validation">Enter the code printed on the approved claim PDF.</div></section></main>
<script>const form=document.getElementById('form'),code=document.getElementById('code'),result=document.getElementById('result'),preset=new URLSearchParams(location.search).get('code')||'';code.value=preset;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function verify(){const r=await fetch(`/api/claim-verification/${encodeURIComponent(code.value.trim())}`),d=await r.json().catch(()=>({}));result.className=`validation ${d.valid?'ok':'bad'}`;result.innerHTML=r.ok?`<strong>${d.valid?'VALID APPROVAL':'APPROVAL NOT VALID'}</strong><br>${esc(d.reason)}<br>Reference: ${esc(d.reference)}<br>Department: ${esc(d.department)}<br>Claimant: ${esc(d.claimant)}<br>Approved: ${esc(d.approvedQuantity)} of ${esc(d.claimedQuantity)}<br>HoD: ${esc(d.approvedBy)}<br>Date: ${esc(new Date(d.approvedAt).toLocaleString())}`:esc(d.error||'The verification could not be completed.')}form.onsubmit=e=>{e.preventDefault();verify()};if(preset)verify();</script></body></html>
