<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certify Claim</title><link rel="stylesheet" href="/styles.css"></head><body>
<header class="topbar"><div class="brand"><img src="/ucc-logo.png" alt="UCC logo"><div><h1>Claim Certification</h1><small>College of Distance Education</small></div></div></header>
<main class="page-wrap"><section class="form-card" style="max-width:760px;margin:auto"><div class="eyebrow">Protected email confirmation</div><h2 id="heading">Review your declaration</h2><div id="content" class="validation">Loading claim details…</div><label id="declarationBox" class="claim-declaration" hidden><input id="accept" type="checkbox"><span><strong>Declaration</strong><br><span id="declaration"></span></span></label><div class="actions"><button id="confirm" class="btn" type="button" disabled>Electronically Certify Claim</button></div><div id="status" class="status"></div></section></main>
<script>const token=new URLSearchParams(location.search).get('token')||'',content=document.getElementById('content'),box=document.getElementById('declarationBox'),accept=document.getElementById('accept'),button=document.getElementById('confirm'),status=document.getElementById('status');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function request(url,options){const r=await fetch(url,options),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed.');return d}async function load(){try{const d=await request(`/api/claim-certification/${encodeURIComponent(token)}`);content.className='validation ok';content.innerHTML=`<strong>Claim ${esc(d.reference)}</strong><br>${esc(d.claimantName)} · ${esc(d.claimantEmail)}<br>Expires: ${esc(new Date(d.expiresAt).toLocaleString())}`;document.getElementById('declaration').textContent=d.declarationText;box.hidden=false;accept.onchange=()=>button.disabled=!accept.checked}catch(e){content.className='validation bad';content.textContent=e.message}}button.onclick=async()=>{button.disabled=true;try{const d=await request(`/api/claim-certification/${encodeURIComponent(token)}/confirm`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({declarationAccepted:true})});box.hidden=true;content.className='validation ok';content.textContent=`Claim ${d.reference} was electronically certified on ${new Date(d.verifiedAt).toLocaleString()}.`;status.className='status show ok';status.textContent='Certification completed. You may close this page.'}catch(e){status.className='status show bad';status.textContent=e.message;button.disabled=false}};load();</script></body></html>
