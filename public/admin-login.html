<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrator Login</title><link rel="stylesheet" href="/styles.css"></head><body>
<header class="topbar"><div class="brand"><img src="/ucc-logo.png" alt="UCC logo"><div><h1>Administrator Login</h1><small>UCC Academic Submission Portals</small></div></div><a class="navlink" href="/">Public portals</a></header>
<main class="page-wrap"><form id="loginForm" class="form-card login-card"><div class="page-intro compact"><div class="eyebrow">Protected Access</div><h2>Sign in</h2><p>Use your department master account or individual administrator credentials.</p></div><section class="section"><div class="field"><label>Department <span class="req">*</span></label><select id="department" name="department" required><option value="">Select department</option><option value="education">Department of Education Programmes</option><option value="business">Department of Business Programmes</option><option value="arts-social-sciences">Department of Arts and Social Sciences</option><option value="science-mathematics">Department of Science and Mathematics Programmes</option></select></div><div class="field"><label>Username <span class="req">*</span></label><input name="username" required autocomplete="username"></div><div class="field"><label>Password <span class="req">*</span></label><input name="password" type="password" required autocomplete="current-password"></div></section><div class="actions"><button id="loginBtn" class="btn" type="submit">Login</button></div><div id="status" class="status"></div></form></main><footer>University of Cape Coast · Administrator Login</footer>
<script>const f=document.getElementById('loginForm'),b=document.getElementById('loginBtn'),st=document.getElementById('status'),d=document.getElementById('department');const q=new URLSearchParams(location.search);if(q.get('department'))d.value=q.get('department');f.addEventListener('submit',async e=>{e.preventDefault();if(!f.reportValidity())return;b.disabled=true;const old=b.textContent;b.textContent='Signing in…';st.className='status';try{const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error||'Login failed.');const next=q.get('next');location.href=(next&&/^\/(admin|payroll|auditor)\//.test(next))?next:(x.redirect||'/admin');}catch(err){st.className='status show bad';st.textContent=err.message||'Login failed.';}finally{b.disabled=false;b.textContent=old;}});</script></body></html>
